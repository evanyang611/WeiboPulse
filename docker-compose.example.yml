version: '3.8'

services:
  weibo_pulse:
    build: .
    image: weibo_pulse:latest
    container_name: weibo_pulse
    user: "1000:1000"  # 根据您的环境修改用户ID
    ports:
      - "8000:8000"    # 外部端口:内部端口
    volumes:
      - ./data:/app/data  # 数据目录挂载
    environment:
      - TZ=Asia/Shanghai
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - RSS_BASE_URL=http://your-rss-server:port/rss/user/
      - ALIYUN_API_KEY=your-api-key-here
      - TEXT_MODEL=deepseek-r1
      - MULTIMODAL_MODEL=qwen-omni-turbo-latest
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G 